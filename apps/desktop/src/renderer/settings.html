<!doctype html>
<html lang="en" data-i18n-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'"
    />
    <title>No More Clickbait — Settings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" /></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" /><path d="M12 10v5M12 18v.5" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9 9l6 6M15 9l-6 6" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.5v.5" /></symbol>
    </svg>

    <main class="s">
      <h1 data-i18n="settingsTitle">Settings</h1>
      <p class="sub" data-i18n="settingsSub">
        The same settings as the extension's options page — a change here is sent to the
        browser extension, and a change there shows up here. Changes are saved as you make them.
      </p>

      <div class="s-notes">
        <div role="alert">
          <p class="call call--bad">
            <svg class="i" aria-hidden="true"><use href="#i-x" /></svg>
            <span id="load-note" class="call__text"></span>
          </p>
        </div>
        <div aria-live="polite">
          <p class="call call--warn">
            <svg class="i" aria-hidden="true"><use href="#i-warn" /></svg>
            <span id="outdated-note" class="call__text"></span>
          </p>
        </div>
        <div aria-live="polite">
          <p class="call call--info">
            <svg class="i" aria-hidden="true"><use href="#i-info" /></svg>
            <span id="pending-note" class="call__text"></span>
          </p>
        </div>
        <div role="alert">
          <p class="call call--bad">
            <svg class="i" aria-hidden="true"><use href="#i-x" /></svg>
            <span id="mode-b-note" class="call__text"></span>
          </p>
        </div>
      </div>

      <!-- Moved into the "Browser and language" section; saved on its own, not with the form. -->
      <div id="browser-field" class="f">
        <label class="f__full" for="browser-choice" data-i18n="browserForCollecting">Browser for collecting</label>
        <select id="browser-choice" class="select f__full" aria-describedby="browser-note"></select>
        <p id="browser-note" class="f__desc" aria-live="polite"></p>
      </div>
      <div id="settings-form"></div>

      <div class="toast" role="status" aria-live="polite">
        <p id="save-box" class="save">
          <svg class="i" aria-hidden="true" hidden><use href="#i-check" /></svg>
          <span id="save-note" class="save__text"></span>
        </p>
      </div>
    </main>

    <script src="settings-page.js"></script>
  </body>
</html>
